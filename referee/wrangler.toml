# UncleStev Arcade referee — Cloudflare Worker config.
# Deploy: connect this repo in the Cloudflare dashboard with root directory "referee",
# or run `npx wrangler deploy` from this folder.
name = "arcade-referee"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[vars]
ARCADE_NAME = "UncleStev Arcade"
# Sites allowed to call the referee from a browser (comma-separated).
ALLOWED_ORIGINS = "https://unclestev.github.io"

# The referee's Nostr private key is a secret, never stored in this file:
#   Dashboard → Worker → Settings → Variables and Secrets → Add → Secret → REFEREE_SECRET

# Pending runs for games verified later (deferred), e.g. Dirtbox Rally. Free KV store "arcade-runs".
[[kv_namespaces]]
binding = "RUNS"
id = "4e21f5317eff43a0af9e37a7df7ad3ef"

# The verifier job (.github/workflows/verify-runs.yml) authenticates with a shared token:
#   Dashboard → Worker → Settings → Variables and Secrets → Add → Secret → VERIFIER_TOKEN
# and the same value as a GitHub Actions repository secret named VERIFIER_TOKEN.
