# Replays runs for games the referee checks later (Dirtbox Rally) and finalizes their scores.
# Needs the repository secret VERIFIER_TOKEN (the same value as the referee Worker's VERIFIER_TOKEN).
name: Verify pending runs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: verify-runs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay pending runs
        run: node tools/verify-pending.mjs
        env:
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
